[package]
name = "narolink"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Naro — a workspace for local coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.7"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui_commonmark = { version = "0.22", default-features = false }
egui_extras = { version = "0.33", default-features = false, features = ["syntect"] }
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
memchr = "2"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSAttributedString", "NSEvent", "NSOpenPanel", "NSPasteboard", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSAttributedString", "NSData", "NSRange", "NSString", "NSURL"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
egui-file-dialog = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[patch.crates-io]
# Local copy exposing the hovered link destination for chat context menus.
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
